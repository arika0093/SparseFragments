name: Playground (GitHub Pages)

# Builds the Blazor WebAssembly playground and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - playground/**
      - src/**
      - .github/workflows/playground.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-playground-nuget-${{ hashFiles('playground/**/*.csproj', 'src/**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-playground-nuget-

      - name: Publish playground
        run: dotnet publish playground/SparseTypes.Playground/SparseTypes.Playground.csproj --configuration Release --output dist

      - name: Prepare Pages site
        shell: bash
        run: PLAYGROUND_SITE_DIR=dist/wwwroot node tests/e2e/playground/scripts/prepare-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wwwroot

  e2e:
    needs: build
    uses: ./.github/workflows/playground-e2e.yaml

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, e2e]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
