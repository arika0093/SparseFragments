name: Strict tests

on:
  workflow_call:
  push:
    branches: [main]
    # Version-bump pushes are validated by release.yaml, which invokes this
    # reusable workflow as its strict-test gate.
    paths-ignore:
      - version.json
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Run direct and called workflows, skipping Dependabot PRs already checked by
# their caller.

jobs:
  # Check shippable C# sources on every run, including the source-only Shared
  # package, which project-level formatter targets do not compile.
  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check src/

  # Regular unit tests (TUnit).
  unit:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR fast path: Linux only. Main/dispatch/release-caller: full matrix.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Restore unit test dependencies
        run: dotnet restore tests/SparseTypes.Tests/SparseTypes.Tests.csproj

      - name: Build unit tests
        run: dotnet build tests/SparseTypes.Tests/SparseTypes.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/SparseTypes.Tests/SparseTypes.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          --results-directory TestResults --no-progress
          -- --timeout 10m --report-trx

      - name: Collect code coverage (observation)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test tests/SparseTypes.Tests/SparseTypes.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          --results-directory TestResults/coverage --no-progress
          -- --timeout 10m --coverage --coverage-settings tests/coverage.config
          --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-unit-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
            tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # Public API surface gate.
  public-api:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore PublicApi test dependencies
        run: dotnet restore tests/SparseTypes.PublicApi.Tests/SparseTypes.PublicApi.Tests.csproj

      - name: Build PublicApi tests
        run: dotnet build tests/SparseTypes.PublicApi.Tests/SparseTypes.PublicApi.Tests.csproj --no-restore --configuration Release

      - name: Run PublicApi tests
        run: >
          dotnet test tests/SparseTypes.PublicApi.Tests/SparseTypes.PublicApi.Tests.csproj
          --no-build --no-restore --configuration Release
          --results-directory TestResults/public-api --no-progress
          -- --timeout 10m --report-trx

      - name: Upload failure PublicApi artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-public-api-results
          path: |
            TestResults/public-api/**/*.trx
            TestResults/public-api/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Pack once, verify integrity, then test consumers, README, and docs against
  # those same package bytes. One OS is sufficient for packaging.
  package-consumers:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack NuGet packages
        # Let pack restore and build; this job has not restored the projects.
        # All three shipped packages are packed above.
        run: >
          dotnet pack src/SparseTypes/SparseTypes.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.Blazor/SparseTypes.Blazor.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseTypes.Generator.Shared/SparseTypes.Generator.Shared.csproj
          --configuration Release --output artifacts

      - name: Verify docs enforcement probes
        # Maintained negative probes for the docs sample enforcement.
        # Static only: no pack needed, so this runs before the consumer gates.
        run: bash ./.github/workflows/scripts/test-check-docs-samples.sh

      - name: Verify packed target assets
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Verify packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-sparse-consumer.sh artifacts

      - name: Verify C# 9.0 language-version consumer
        run: bash ./.github/workflows/scripts/verify-package-langversion-consumer.sh artifacts

      - name: Verify stale same-version isolation
        run: bash ./.github/workflows/scripts/verify-package-stale-isolation.sh artifacts

      - name: Verify Shared source-only package consumer
        run: bash ./.github/workflows/scripts/verify-package-shared-consumer.sh artifacts

      - name: Verify README samples against packed packages
        run: bash ./.github/workflows/scripts/verify-sparsetypes-readme.sh artifacts

      - name: Verify docs samples against packed packages
        run: bash ./.github/workflows/scripts/verify-docs-samples.sh artifacts

  # .NET Framework 4.8 compatibility gate for the packed core package. The net48
  # consumer runs on Windows; Blazor and net10 TUnit tests are excluded.
  netframework-consumer:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack core NuGet package
        run: >
          dotnet pack src/SparseTypes/SparseTypes.csproj
          --configuration Release --output artifacts

      - name: Verify net48 packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-netfx-consumer.sh artifacts

      - name: Verify C# 9.0 language-version consumer
        run: bash ./.github/workflows/scripts/verify-package-langversion-consumer.sh artifacts

  # Publish and run the NativeAOT test binary independently of managed tests.
  # PRs use Linux; main and release run every supported OS before publishing.
  nativeaot:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR fast path: Linux only. Main/dispatch/release-caller: full matrix.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT tests
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet publish tests/SparseTypes.NativeAotSmoke/SparseTypes.NativeAotSmoke.csproj \
            --configuration Release --framework net10.0 --use-current-runtime \
            --output TestResults/nativeaot-smoke --verbosity normal 2>&1 \
            | tee TestResults/nativeaot-publish.log

      - name: Assert NativeAOT diagnostics are clean
        shell: bash
        run: bash ./.github/workflows/scripts/assert-sparse-aot-diagnostics.sh TestResults/nativeaot-publish.log

      - name: Run NativeAOT tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./TestResults/nativeaot-smoke/SparseTypes.NativeAotSmoke.exe --report-trx --results-directory TestResults/nativeaot-results
          else
            ./TestResults/nativeaot-smoke/SparseTypes.NativeAotSmoke --report-trx --results-directory TestResults/nativeaot-results
          fi

      - name: Upload failure NativeAOT artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-nativeaot-results-${{ matrix.os }}
          path: |
            TestResults/nativeaot-publish.log
            TestResults/nativeaot-smoke/**
            TestResults/nativeaot-results/**
          if-no-files-found: ignore
          retention-days: 7
