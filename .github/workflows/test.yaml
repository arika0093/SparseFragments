name: Strict tests

on:
  workflow_call:
  push:
    branches: [main]
    # Version-bump pushes are validated by release.yaml, which invokes this
    # reusable workflow as its strict-test gate. Ignoring version.json here
    # avoids running two identical job graphs for the same commit.
    paths-ignore:
      - version.json
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every job below runs for direct push/pull_request/dispatch runs and for
# caller invocations (release.yaml, dependabot-merge.yaml). The per-job guard
# only skips the direct pull_request run for Dependabot PRs: those are already
# validated by the dependabot-merge.yaml caller invocation of this same
# workflow (the github context of a called workflow belongs to its caller, so
# github.workflow names the caller there), and running both would duplicate
# the whole job graph for the same commit. Ordinary PRs run here directly,
# which keeps the required check names ("Strict tests / <job>") stable enough
# for a branch-protection rule.
#
# Tiered OS policy (#20): pull_request runs (direct or via the
# dependabot-merge caller, where github.event_name is still pull_request) use
# a single-OS fast path, while push-to-main, workflow_dispatch, and
# non-PR caller invocations (release.yaml) run the full OS matrix.
# Job names never change between tiers, so branch protection stays stable.
# Branch-protection tip: require the ubuntu legs ("Strict tests / unit
# (ubuntu-latest)", "Strict tests / nativeaot (ubuntu-latest)") plus
# format, public-api and package-consumers. Those five checks exist in both
# tiers; the macos/windows legs only appear in the full-matrix tier.
#
# Failure-class map (which dimension catches what):
# - unit matrix OS: managed TUnit logic is nearly OS-independent; the Linux
#   PR leg catches regressions fast, and the full matrix on main/release
#   catches OS-specific filesystem, path, casing, and line-ending behavior.
# - public-api (Linux only): API surface approval/audience drift, fully
#   OS-independent; one leg is sufficient in every tier.
# - package-consumers (Linux only): pack integrity plus packed-feed consumer,
#   README-sample, and docs-sample drift; OS-independent packaging logic, one
#   leg always.
# - nativeaot matrix OS: the OS-sensitive tier. Each leg links against a
#   distinct toolchain (Linux clang/zlib, macOS Xcode, Windows MSVC) and
#   catches trimming/AOT diagnostics specific to that target. PRs run the
#   Linux smoke leg; main/release run every supported OS before publish.

jobs:
  # Repository formatting gate (#83). CSharpier.MsBuild enforces formatting
  # only for projects that compile the checked sources; the source-only
  # Generator.Shared package compiles nothing itself, so its drift surfaced
  # only at pack time and blocked the whole package-consumers job. This
  # canonical check covers the shippable surface on every run instead.
  # Scope is intentionally src/: wider scopes carry pre-existing formatter
  # drift from older CSharpier versions and are owned separately.
  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check src/

  # Regular unit tests (TUnit). Builds only the test project and its
  # src references so the Blazor playground never affects this job.
  # PR tier: Linux only (fast signal). Main/release tier: full OS matrix.
  unit:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR fast path: Linux only. Main/dispatch/release-caller: full matrix.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Restore unit test dependencies
        run: dotnet restore tests/SparseFragments.Tests/SparseFragments.Tests.csproj

      - name: Build unit tests
        run: dotnet build tests/SparseFragments.Tests/SparseFragments.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/SparseFragments.Tests/SparseFragments.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          --results-directory TestResults --no-progress
          -- --timeout 5m --report-trx

      - name: Collect code coverage (observation)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test tests/SparseFragments.Tests/SparseFragments.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          --results-directory TestResults/coverage --no-progress
          -- --timeout 5m --coverage --coverage-settings tests/coverage.config
          --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-unit-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
            tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # Public API surface gate (#11). Approval snapshots plus audience
  # classification must pass before merge and before any release.
  # Single-OS by design in every tier: API surface is OS-independent.
  public-api:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore PublicApi test dependencies
        run: dotnet restore tests/SparseFragments.PublicApi.Tests/SparseFragments.PublicApi.Tests.csproj

      - name: Build PublicApi tests
        run: dotnet build tests/SparseFragments.PublicApi.Tests/SparseFragments.PublicApi.Tests.csproj --no-restore --configuration Release

      - name: Run PublicApi tests
        run: >
          dotnet test tests/SparseFragments.PublicApi.Tests/SparseFragments.PublicApi.Tests.csproj
          --no-build --no-restore --configuration Release
          --results-directory TestResults/public-api --no-progress
          -- --timeout 5m --report-trx

      - name: Upload failure PublicApi artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-public-api-results
          path: |
            TestResults/public-api/**/*.trx
            TestResults/public-api/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Packed-package consumer gate (#11). Packs the release candidate packages
  # once, verifies their integrity, then exercises them the way users consume
  # them: fixtures install the packed SparseFragments (and Blazor, #46) packages
  # from a local feed (no ProjectReference fallback), the README fixture runs
  # through verify-sparsefragments-readme.sh, and the docs guides run through
  # verify-docs-samples.sh (#45). The same bytes validated here are what
  # the consumer checks run against; nothing is rebuilt a second time.
  # Single-OS by design in every tier: packing logic is OS-independent.
  package-consumers:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack NuGet packages
        # NOTE: no --no-build/--no-restore here. This job never restores the
        # test projects, so let pack restore/build itself instead.
        # Three packages ship (#46, #70): SparseFragments,
        # SparseFragments.Blazor, and SparseFragments.Generator.Shared
        # (source-only downstream-generator sources).
        run: >
          dotnet pack src/SparseFragments/SparseFragments.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseFragments.Blazor/SparseFragments.Blazor.csproj
          --configuration Release --output artifacts &&
          dotnet pack src/SparseFragments.Generator.Shared/SparseFragments.Generator.Shared.csproj
          --configuration Release --output artifacts

      - name: Verify packed target assets
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Verify packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-sparse-consumer.sh artifacts

      - name: Verify stale same-version isolation
        run: bash ./.github/workflows/scripts/verify-package-stale-isolation.sh artifacts

      - name: Verify Shared source-only package consumer
        run: bash ./.github/workflows/scripts/verify-package-shared-consumer.sh artifacts

      - name: Verify README samples against packed packages
        run: bash ./.github/workflows/scripts/verify-sparsefragments-readme.sh artifacts

      - name: Verify docs samples against packed packages
        run: bash ./.github/workflows/scripts/verify-docs-samples.sh artifacts

  # .NET Framework 4.8 compatibility lane (#49). Consumes the packed
  # release-candidate core package from a local feed and executes the net48
  # fixture under .NET Framework. Windows-only by design; Blazor stays
  # excluded from net48. Part of the strict/release gate via workflow_call.
  # NOTE: the TUnit suite itself stays net10.0-only because it exercises modern
  # BCL surface (e.g. IReadOnlySet<T>) with no net48 equivalent; the dedicated
  # net48 consumer below is the behavioral compatibility gate instead.
  netframework-consumer:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack core NuGet package
        run: >
          dotnet pack src/SparseFragments/SparseFragments.csproj
          --configuration Release --output artifacts

      - name: Verify net48 packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-netfx-consumer.sh artifacts

  # True NativeAOT publish gate (#9, #19). Publishes the NativeAOT TUnit
  # project and executes the native test binary directly. Independent from
  # `unit` (no `needs:`) so GitHub Actions schedules both jobs in parallel
  # across the OS matrix.
  # PR tier: Linux smoke leg only (toolchain signal without 3x link cost).
  # Main/release tier: full supported OS matrix (each OS links natively and
  # catches target-specific trimming/AOT failures before publish).
  nativeaot:
    if: >-
      github.workflow != 'Strict tests' ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR fast path: Linux only. Main/dispatch/release-caller: full matrix.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT tests
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet publish tests/SparseFragments.NativeAotSmoke/SparseFragments.NativeAotSmoke.csproj \
            --configuration Release --framework net10.0 --use-current-runtime \
            --output TestResults/nativeaot-smoke --verbosity normal 2>&1 \
            | tee TestResults/nativeaot-publish.log

      - name: Assert NativeAOT diagnostics are clean
        shell: bash
        run: bash ./.github/workflows/scripts/assert-sparse-aot-diagnostics.sh TestResults/nativeaot-publish.log

      - name: Run NativeAOT tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./TestResults/nativeaot-smoke/SparseFragments.NativeAotSmoke.exe --report-trx --results-directory TestResults/nativeaot-results
          else
            ./TestResults/nativeaot-smoke/SparseFragments.NativeAotSmoke --report-trx --results-directory TestResults/nativeaot-results
          fi

      - name: Upload failure NativeAOT artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-nativeaot-results-${{ matrix.os }}
          path: |
            TestResults/nativeaot-publish.log
            TestResults/nativeaot-smoke/**
            TestResults/nativeaot-results/**
          if-no-files-found: ignore
          retention-days: 7
