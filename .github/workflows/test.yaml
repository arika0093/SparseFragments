name: Strict tests

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore SparseFragments.slnx

      - name: Build
        run: dotnet build SparseFragments.slnx --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --solution SparseFragments.slnx --no-build --no-restore
          --configuration Release --framework net10.0
          -- --timeout 5m --report-trx --results-directory TestResults --no-progress

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT smoke test
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet publish tests/SparseFragments.NativeAotSmoke/SparseFragments.NativeAotSmoke.csproj \
            --configuration Release --framework net10.0 \
            --output TestResults/nativeaot-smoke --verbosity normal 2>&1 \
            | tee TestResults/nativeaot-publish.log

      - name: Assert NativeAOT diagnostics are clean
        shell: bash
        run: bash ./.github/workflows/scripts/assert-sparse-aot-diagnostics.sh TestResults/nativeaot-publish.log

      - name: Run NativeAOT smoke test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./TestResults/nativeaot-smoke/SparseFragments.NativeAotSmoke.exe
          else
            ./TestResults/nativeaot-smoke/SparseFragments.NativeAotSmoke
          fi

      - name: Collect code coverage (observation)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test tests/SparseFragments.Tests/SparseFragments.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          -- --timeout 5m --coverage --coverage-settings tests/coverage.config
          --coverage-output coverage.cobertura.xml --coverage-output-format cobertura
          --results-directory TestResults/coverage --no-progress

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
            TestResults/nativeaot-publish.log
            tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack NuGet packages
        run: >
          dotnet pack SparseFragments.slnx --no-build --no-restore
          --configuration Release --output artifacts

      - name: Verify packed target assets
        if: matrix.os == 'ubuntu-latest'
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts
