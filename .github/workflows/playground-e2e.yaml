name: Playground E2E

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - playground/**
      - src/**
      - tests/e2e/playground/**
      - .github/workflows/playground-e2e.yaml
      - .github/workflows/playground.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/playground/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-playground-e2e-nuget-${{ hashFiles('playground/**/*.csproj', 'src/**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-playground-e2e-nuget-

      - name: Install Playwright dependencies
        working-directory: tests/e2e/playground
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e/playground
        run: npx playwright install --with-deps chromium

      # Each stage below runs separately so its stderr and exit code identify
      # the failing stage. Previously `npm run serve` chained publish, prepare,
      # and serve inside the Playwright webServer, and any failure surfaced
      # only as "Process from config.webServer was not able to start."
      # The E2E job republishes instead of reusing the Pages artifact because
      # upload-pages-artifact output is not addressable from this called
      # workflow, and this job also runs standalone on pull requests. Both
      # paths prepare the site with the same prepare-site.mjs script.
      - name: Publish playground
        working-directory: tests/e2e/playground
        run: npm run build

      - name: Prepare E2E site
        working-directory: tests/e2e/playground
        run: npm run prepare-site

      - name: Verify E2E site
        working-directory: tests/e2e/playground
        run: npm run verify

      - name: Run browser tests
        working-directory: tests/e2e/playground
        env:
          PLAYGROUND_PREBUILT: "1"
        run: npm test

      - name: Collect E2E site diagnostics
        if: failure()
        working-directory: tests/e2e/playground
        run: |
          mkdir -p e2e-diagnostics
          {
            echo "node: $(node --version)"
            echo "dotnet: $(dotnet --version)"
            echo "site: $PWD/artifacts/wwwroot"
            echo "--- wwwroot (top level) ---"
            ls -la artifacts/wwwroot 2>&1 | head -30 || echo "wwwroot listing failed"
            echo "--- base tag ---"
            grep -o '<base[^>]*>' artifacts/wwwroot/index.html 2>&1 || echo "index.html base tag unreadable"
            echo "--- required files ---"
            test -f artifacts/wwwroot/404.html && echo "404.html: present" || echo "404.html: MISSING"
            test -f artifacts/wwwroot/.nojekyll && echo ".nojekyll: present" || echo ".nojekyll: MISSING"
            echo "--- port 4173 ---"
            (ss -ltn 2>/dev/null | grep ':4173 ' || echo "nothing listening on 4173")
          } | tee e2e-diagnostics/summary.txt

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playground-e2e-results
          path: |
            tests/e2e/playground/playwright-report/
            tests/e2e/playground/test-results/
            tests/e2e/playground/e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
