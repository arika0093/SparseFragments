name: Release packages

# Pack-once release flow: package-candidate packs the canonical release
# candidate .nupkg set once and uploads it as a workflow artifact.
# GitHub Release / NuGet publication publish those same bytes without
# repacking. Version truth stays with Nerdbank.GitVersioning.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.json

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  package-candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read package version
        uses: dotnet/nbgv@master
        id: nbgv

      - name: Export package version
        id: version
        env:
          SEMVER: ${{ steps.nbgv.outputs.SemVer2 }}
        run: echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore SparseFragments.slnx

      - name: Build
        run: dotnet build SparseFragments.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: dotnet pack SparseFragments.slnx --no-build --no-restore --configuration Release --output artifacts

      - name: Verify release candidate packages
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Upload release candidate packages
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  strict-test:
    uses: ./.github/workflows/test.yaml

  release-github:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
    permissions:
      contents: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.package-candidate.outputs.version }}
          tag_name: ${{ needs.package-candidate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.nupkg
          prerelease: ${{ contains(needs.package-candidate.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-nuget:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
    permissions:
      id-token: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
