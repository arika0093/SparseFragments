name: Release packages

# Pack-once release flow: package-candidate packs the canonical release
# candidate.nupkg set once and uploads it as a workflow artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.json

permissions:
  contents: read

# Use the CI SDK compatibility band (10.0.x); global.json sets its minimum.
# Publish the exact package bytes built and tested in this run.

jobs:
  package-candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log selected SDK
        run: |
          dotnet --info
          echo "Selected SDK: $(dotnet --version)"

      # Pin actions to released tags and align toolVersion with the repo's
      # Nerdbank.GitVersioning package and nbgv tool.
      - name: Read package version
        uses: dotnet/nbgv@v0.5.2
        id: nbgv
        with:
          toolVersion: 3.10.94

      - name: Export package version
        id: version
        env:
          SEMVER: ${{ steps.nbgv.outputs.SemVer2 }}
        run: echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore SparseTypes.slnx

      - name: Build
        run: dotnet build SparseTypes.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: dotnet pack SparseTypes.slnx --no-build --no-restore --configuration Release --output artifacts

      - name: Verify release candidate packages
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Upload release candidate packages
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  strict-test:
    uses: ./.github/workflows/test.yaml

  # Test the packed candidate from a local feed, with no repack or
  # ProjectReference fallback, before publishing those same package bytes.
  candidate-consumers:
    runs-on: ubuntu-latest
    needs:
      - package-candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: Verify packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-sparse-consumer.sh artifacts

      - name: Verify C# 9.0 language-version consumer
        run: bash ./.github/workflows/scripts/verify-package-langversion-consumer.sh artifacts

      - name: Verify stale same-version isolation
        run: bash ./.github/workflows/scripts/verify-package-stale-isolation.sh artifacts

      - name: Verify Shared source-only package consumer
        run: bash ./.github/workflows/scripts/verify-package-shared-consumer.sh artifacts

      - name: Verify README samples against release candidate
        run: bash ./.github/workflows/scripts/verify-sparsetypes-readme.sh artifacts

      - name: Verify docs samples against release candidate
        run: bash ./.github/workflows/scripts/verify-docs-samples.sh artifacts

  release-github:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
      && needs.candidate-consumers.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
      - candidate-consumers
    permissions:
      contents: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.package-candidate.outputs.version }}
          tag_name: ${{ needs.package-candidate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.nupkg
          prerelease: ${{ contains(needs.package-candidate.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-nuget:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
      && needs.candidate-consumers.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
      - candidate-consumers
    permissions:
      id-token: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
