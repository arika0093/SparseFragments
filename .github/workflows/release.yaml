name: Release packages

# Pack-once release flow: package-candidate packs the canonical release
# candidate .nupkg set once and uploads it as a workflow artifact.
# GitHub Release / NuGet publication publish those same bytes without
# repacking. Version truth stays with Nerdbank.GitVersioning.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.json

permissions:
  contents: read

# SDK selection policy (#104, supersedes the exact-SDK policy from #84):
# release uses the same compatibility-band approach as normal CI
# (`10.0.x`). global.json keeps a minimum/baseline SDK version with
# `rollForward: latestFeature` and is not treated as an exact release lock.
# Release reproducibility means one run packs one candidate and publishes
# those exact candidate bytes (pack-once candidate identity, #79), not
# byte-identical rebuilds with a historical SDK patch.

jobs:
  package-candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log selected SDK
        run: |
          dotnet --info
          echo "Selected SDK: $(dotnet --version)"

      # Reproducibility policy (#26): pin to a released tag (Dependabot
      # github-actions ecosystem proposes upgrades). Never use @master here.
      # toolVersion matches the pinned Nerdbank.GitVersioning MSBuild package
      # (src/Directory.Build.props) and the nbgv dotnet tool
      # (.config/dotnet-tools.json) so version computation is reproducible.
      - name: Read package version
        uses: dotnet/nbgv@v0.5.2
        id: nbgv
        with:
          toolVersion: 3.10.94

      - name: Export package version
        id: version
        env:
          SEMVER: ${{ steps.nbgv.outputs.SemVer2 }}
        run: echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore SparseFragments.slnx

      - name: Build
        run: dotnet build SparseFragments.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: dotnet pack SparseFragments.slnx --no-build --no-restore --configuration Release --output artifacts

      - name: Verify release candidate packages
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Upload release candidate packages
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  strict-test:
    uses: ./.github/workflows/test.yaml

  # Consumes the already-packed release candidate exactly as users would:
  # fixtures install the candidate SparseFragments (and Blazor, #46) packages
  # from a local feed (no ProjectReference fallback, no second pack), the
  # Shared source-only package (#70) is consumed package-only with no sibling
  # fallback, the README fixture runs through
  # verify-sparsefragments-readme.sh, and the docs guides run through
  # verify-docs-samples.sh (#45). Publishing below is blocked unless these
  # checks pass on the same candidate bytes.
  candidate-consumers:
    runs-on: ubuntu-latest
    needs:
      - package-candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: Verify packed package consumer
        run: bash ./.github/workflows/scripts/verify-package-sparse-consumer.sh artifacts

      - name: Verify stale same-version isolation
        run: bash ./.github/workflows/scripts/verify-package-stale-isolation.sh artifacts

      - name: Verify Shared source-only package consumer
        run: bash ./.github/workflows/scripts/verify-package-shared-consumer.sh artifacts

      - name: Verify README samples against release candidate
        run: bash ./.github/workflows/scripts/verify-sparsefragments-readme.sh artifacts

      - name: Verify docs samples against release candidate
        run: bash ./.github/workflows/scripts/verify-docs-samples.sh artifacts

  release-github:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
      && needs.candidate-consumers.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
      - candidate-consumers
    permissions:
      contents: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.package-candidate.outputs.version }}
          tag_name: ${{ needs.package-candidate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.nupkg
          prerelease: ${{ contains(needs.package-candidate.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-nuget:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
      && needs.candidate-consumers.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
      - candidate-consumers
    permissions:
      id-token: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
